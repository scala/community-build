// https://github.com/scalameta/scalafmt.git#4d0ef7cba0528d8ae3e9c8694cff57cb338db07c  # was main

// 4d0ef7 is the commit with the Scalameta 4.13.7 upgrade;
// see scalameta.conf

vars.proj.scalafmt: ${vars.base} {
  name: "scalafmt"
  uri: "https://github.com/scalameta/scalafmt.git#4d0ef7cba0528d8ae3e9c8694cff57cb338db07c"

  extra.projects: ["coreJVM", "cli", "tests", "dynamic"]
  extra.commands: ${vars.default-commands} [
    // CliTest uses mdoc which requires Java 11+, and dbuild hangs.
    // we lack a slicker way to tell dbuild not to even try to build the project
    // on Java 8, so:
    """eval require(scala.util.Properties.isJavaAtLeast("11"))"""
    // context: https://github.com/scalameta/scalafmt/pull/4497
    """set ThisBuild / dependencyOverrides -= "org.jline" % "jline" % "3.23.0""""
    // not investigated? I don't remember
    """set tests.jvm / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "CliTest.scala""""
    """set sysops.jvm / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "GitOpsTest.scala""""
    """set dynamic.jvm / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "DynamicSuite.scala""""
  ]
}
