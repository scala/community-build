// https://github.com/typelevel/jawn-fs2.git#main

vars.proj.jawn-fs2: ${vars.base} {
  name: "jawn-fs2"
  uri: "https://github.com/typelevel/jawn-fs2.git#0fe814b0cdde561401f5317253af8e23f831b534"

  extra.exclude: ["*JS", "*Native"]
  extra.settings: ${vars.base.extra.settings} [
    // should be removable once they correct the out-of-date value
    """ThisBuild / tlBaseVersion := "2.6""""
  ]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
  ]
}
