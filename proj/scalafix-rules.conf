// https://github.com/scalacommunitybuild/scalafix-rules.git#community-build-2.13  # was xuwei-k, main

// frozen (July 2026) because it moved to sbt 2
// forked (October 2026) to take ASM upgrade for JDK 27

vars.proj.scalafix-rules: ${vars.base} {
  name: "scalafix-rules"
  uri: "https://github.com/scalacommunitybuild/scalafix-rules.git#02ba5498531357c1b6815b998f1ba328e6a92cd3"

  extra.projects: ["*2_13"]
  extra.settings: ${vars.base.extra.settings} [
    // the tests depend on a fixed scala-asm, which may not read the JDK's class files;
    // the compiler bundles the ASM it was built with
    """LocalProject("testsTarget2_13") / libraryDependencies ~= (_.filterNot(m => m.organization == "org.scala-lang.modules" && m.name == "scala-asm"))"""
  ]
}
