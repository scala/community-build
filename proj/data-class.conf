// https://github.com/alexarchambault/data-class.git#b113ce78d1e4e31861553a568dcea1ebf502c258  # was main

// frozen (July 2026) because the build switched to mill

vars.proj.data-class: ${vars.base} {
  name: "data-class"
  uri: "https://github.com/alexarchambault/data-class.git#b113ce78d1e4e31861553a568dcea1ebf502c258"

  // the repo's .travis.yml does the following:
  //   test test-proj-v1/publishLocal test-proj-v2/mimaReportBinaryIssues proj-v1-user/compile
  // I think trying to do something like in this in the dbuild context is probably more trouble
  // than it's actually worth
  extra.exclude: ["test-proj-*"]
  // exclude a test, pending outcome of https://github.com/scala/scala-dev/issues/928
  extra.commands: ${vars.default-commands} [
    """set `data-class` / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "OneFieldTests.scala""""
  ]
}
