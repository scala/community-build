// https://github.com/typelevel/jawn.git#main

vars.proj.jawn: ${vars.base} {
  name: "jawn"
  uri: "https://github.com/typelevel/jawn.git#e85d2cd77ad6cd40cbbe3288459feb75bbd22b18"

  extra.exclude: ["*JS", "*Native", "benchmark", "root"]
  extra.settings: ${vars.base.extra.settings} [
    // should be removable once they correct the out-of-date value
    """ThisBuild / tlBaseVersion := "1.7""""
    // dbuild gets confused if only crossScalaVersions is set?!
    """ThisBuild / scalaVersion := "2.13.10""""
  ]
  extra.commands: ${vars.default-commands} [
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
  ]
}
