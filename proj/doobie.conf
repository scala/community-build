// https://github.com/typelevel/doobie.git#main

vars.proj.doobie: ${vars.base} {
  name: "doobie"
  uri: "https://github.com/typelevel/doobie.git#3e218d63c72e22802540845052dd645b1bd07e2d"

  extra.options: ["-Xss16m"]  // prevent stack overflow when compiling build definition
  extra.exclude: [
    "*2_12", "*3", "docs", "bench"  // out of scope
    "doobie"   // just an aggregation, and causes missing-tut error
  ]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    """set every gpgKey := Some("")"""
    // as per https://github.com/scala/community-builds/pull/835#issuecomment-455729365,
    // these subprojects require a Postgres instance for the tests to run
    """set postgres        .jvm("2.13.18") / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"""
    """set `postgres-circe`.jvm("2.13.18") / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"""
    """set example         .jvm("2.13.18") / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"""
    """set hikari          .jvm("2.13.18") / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"""
    """set mysql           .jvm("2.13.18") / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"""
  ]
}
