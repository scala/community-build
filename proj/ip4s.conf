// https://github.com/Comcast/ip4s.git#main

vars.proj.ip4s: ${vars.base} {
  name: "ip4s"
  uri: "https://github.com/Comcast/ip4s.git#712db03c0754fec0e44c18b4b455c7882b0bbca1"

  extra.exclude: ["*JS", "*Native"]
  extra.settings: ${vars.base.extra.settings} [
    // dbuild gets confused if only crossScalaVersions is set?!
    """ThisBuild / scalaVersion := "2.13.10""""
  ]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // started failing in November 2026, irrespective of Scala SHA;
    // not reported upstream
    """set testKit.jvm / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "DnsTest.scala""""
  ]
}
