// https://github.com/typelevel/scalacheck-effect.git#main

vars.proj.scalacheck-effect: ${vars.base} {
  name: "scalacheck-effect"
  uri: "https://github.com/typelevel/scalacheck-effect.git#92cbea6a3e8f3a6f1a6db0974a640bf8c4b55b38"

  extra.exclude: ["*JS", "*Native"]
  extra.commands: ${vars.default-commands} [
    // otherwise sbt-gpg errors on `publish`
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
  ]
}
