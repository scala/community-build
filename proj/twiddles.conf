// https://github.com/typelevel/twiddles.git#main

vars.proj.twiddles: ${vars.base} {
  name: "twiddles"
  uri: "https://github.com/typelevel/twiddles.git#7adf5a14f1308fc7e703d3d6d8f74ad4cbcebc64"

  extra.options: ["-Xss16m"]
  extra.exclude: ["*JS", "*Native", "docs"]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // prevent sbt-gpg from asking for passphrase when running locally
    """set every gpgKey := Some("")"""
  ]
}
