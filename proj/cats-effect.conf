// https://github.com/typelevel/cats-effect.git#series/3.x

vars.proj.cats-effect: ${vars.base} {
  name: "cats-effect"
  uri: "https://github.com/typelevel/cats-effect.git#0b7b40b96c6267f2cdc510754d3aeb080e2a9e8f"

  extra.exclude: [
    "*JS", "*Native", "benchmarks", "docs"
  ]
  extra.commands: ${vars.default-commands} [
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // https://github.com/typelevel/cats-effect/issues/4471: the test expects main thread id 1, which is 3 on JDK 25+
    // (fixed upstream in 5ef4b8ab0e)
    """set ioAppTestsJVM / Test / testOptions ++= (if (scala.util.Properties.isJavaAtLeast("25")) Seq(Tests.Exclude(Seq("cats.effect.IOAppSuite"))) else Nil)"""
  ]
}
