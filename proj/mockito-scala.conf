vars.proj.mockito-scala: ${vars.base} {
  name: "mockito-scala"
  uri: "https://github.com/scalacommunitybuild/mockito-scala.git#92a24f788e0316c3112635d04f34bd52f17c14b8"

  extra.exclude: ["scalaz"]
  // Byte Buddy doesn't officially support the newest JDKs yet
