// https://github.com/typelevel/fs2.git#main

vars.proj.fs2: ${vars.base} {
  name: "fs2"
  uri: "https://github.com/typelevel/fs2.git#8f3ae75ab38e061031d7a4daaf5277af29b40cb0"

  extra.exclude: ["*JS", "*Native", "benchmark", "microsite", "unidocs"]
  extra.options: ["-Xmx4g"]
  extra.commands: ${vars.default-commands} [
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // not investigated
    """set integration / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "MemoryLeakSpec.scala""""
    // chews up excessive disk space in /tmp (issue #1734)
    """set io.jvm / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "WalkBenchmark.scala""""
    // JDK 27 appends " (connect failed)" to the ConnectException message SocketSuite matches exactly
    """set io.jvm / Test / testOptions ++= (if (scala.util.Properties.isJavaAtLeast("27")) Seq(Tests.Exclude(Seq("fs2.io.net.SocketSuite"))) else Nil)"""
  ]
}
