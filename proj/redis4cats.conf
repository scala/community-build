// https://github.com/profunktor/redis4cats.git#series/1.x

vars.proj.redis4cats: ${vars.base} {
  name: "redis4cats"
  uri: "https://github.com/profunktor/redis4cats.git#8f656ad517877fa823bf09cdfc3e1067e4e11d89"

  // just whatever pfps-shopping-cart needs
  extra.projects: ["redis4cats-core", "redis4cats-effects", "redis4cats-log4cats"]
  extra.settings: ${vars.base.extra.settings} [
    // the build takes every tag after our commit as current, and sbt-git can't sort "3.0.0-RC2":
    // java.lang.NumberFormatException: For input string: "0-RC2"
    "ThisBuild / git.gitCurrentTags := Nil"
  ]
}
