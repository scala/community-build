// https://github.com/sbt/io.git#1.10.x

// (develop branch is now Scala 3 only)

vars.proj.sbt-io: ${vars.base} {
  name: "sbt-io"
  uri: "https://github.com/sbt/io.git#8cfbe2c734212bba673129039d8bcf991f5f4a04"

  // for JDK 8, as per https://github.com/sbt/sbt/issues/7463 ; might not be necessary
  // anymore by the time we have sbt 1.1.0 final?
  extra.options: ["-Dsbt.io.jdktimestamps=true"]

  extra.commands: ${vars.default-commands} [
    // test allocates large files on `/tmp` which can lead to `IOException: No space left on device` on our infra
    """set io / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "CopySpec.scala""""
  ]
}
