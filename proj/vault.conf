// https://github.com/typelevel/vault.git#main

vars.proj.vault: ${vars.base} {
  name: "vault"
  uri: "https://github.com/typelevel/vault.git#245bac602254e141d0cc9694ee03ebcf452c9914"

  extra.projects: ["coreJVM"]  // no docs, no Scala.js
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
  ]
}
