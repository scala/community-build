// https://github.com/http4s/blaze.git#e4454f4b37e52b679f7d0fa34b1489748ed2e345  # was main

// frozen (August 2026), hopefully temporarily, pending
// resolution of https://github.com/http4s/blaze/issues/1062

vars.proj.blaze: ${vars.base} {
  name: "blaze"
  uri: "https://github.com/http4s/blaze.git#e4454f4b37e52b679f7d0fa34b1489748ed2e345"

  extra.commands: ${vars.default-commands} [
    "appendScalacOptions -Wconf:cat=scala3-migration:w"
    "set every gpgWarnOnFailure := true"
    "removeJavacOptions --release 8"
    // so we don't have to arrange for dbuild-built semanticdb to be brought in
    "set every semanticdbEnabled := false"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // fails on JDK 11 only: https://github.com/http4s/blaze/issues/376
    """set core / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "SSLStageSuite.scala""""
    // fails on JDK 26; not investigated or reported
    """set blazeServer / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "BlazeServerMtlsSpec.scala""""
  ]
}
