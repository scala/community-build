// https://github.com/circe/circe-config.git#main

vars.proj.circe-config: ${vars.base} {
  name: "circe-config"
  uri: "https://github.com/circe/circe-config.git#e6a9ad25dcb09529bc4a23ac9f82e8f3500e4fb5"

  extra.exclude: ["*JS", "*Native"]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // so we don't have to arrange for dbuild-built semanticdb to be brought in
    "set every semanticdbEnabled := false"
  ]
}
