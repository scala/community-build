// https://github.com/twitter/finagle.git#finagle-22.1.0

// if develop proves fragile (e.g. if a SNAPSHOT dependency isn't found),
// it's fine to use a tag.

vars.proj.finagle: ${vars.base} {
  name: "finagle"
  uri: "https://github.com/twitter/finagle.git#95f509abfd27b31cbf20ada53e21216edb7c3ce7"

  // I didn't attempt to add any other subprojects
  extra.projects: ["finagle-core", "finagle-http"]
  extra.commands: ${vars.default-commands} [
    // CachedHashCodeTest started failing in Scala 2.13.17 nightlies,
    // likely because of https://github.com/scala/scala/pull/11023 ;
    // I didn't actually investigate.
    // the others are just historically flaky tests,
    // except SslClientEngineFactoryTest: JDK 17+ rejects the test's SNIHostName "somehost:1234"
    """set finagleCore / Test / unmanagedSources / excludeFilter := HiddenFileFilter || "FailFastFactoryTest.scala" || "StringServerTest.scala" || "CachedHashCodeTest.scala" || "SslClientEngineFactoryTest.scala""""
    // not supported on JDK 11+ / 17+
    "removeJavaOptions -XX:+UseParNewGC -XX:+AggressiveOpts -XX:+UseConcMarkSweepGC -XX:+CMSParallelRemarkEnabled -XX:+CMSClassUnloadingEnabled"
    // JDK 17+: mockito 1.x mocks JDK classes; util-jvm reads Hotspot internals
    """set ThisBuild / javaOptions ++= (if (scala.util.Properties.isJavaAtLeast("9")) Seq("java.base/java.lang", "java.base/java.io", "java.base/java.net", "java.base/java.security.cert", "java.base/java.util.concurrent.atomic", "java.base/javax.net.ssl", "java.logging/java.util.logging", "java.management/sun.management", "java.management/sun.management.counter", "java.management/sun.management.counter.perf").map(p => "--add-opens=" + p + "=ALL-UNNAMED") else Nil)"""
  ]
}
