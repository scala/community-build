// https://github.com/scodec/scodec.git#30f840f79ccccd13d27419ec8a8d692cc30b0a27  # was series/1.11.x

// frozen (May 2025) because a dependency on scalac-compat was added,
// which would pull in MUnit... it could maybe be done, but let's not
// mess with it

vars.proj.scodec: ${vars.base} {
  name: "scodec"
  uri: "https://github.com/scodec/scodec.git#30f840f79ccccd13d27419ec8a8d692cc30b0a27"

  extra.projects: ["coreJVM"]
  extra.settings: ${vars.base.extra.settings} [
    // dbuild gets confused if only crossScalaVersions is set?!
    """ThisBuild / scalaVersion := "2.12.17""""
  ]
  extra.commands: ${vars.default-commands} [
    // because scodec-build brings in sbt-gpg which errors on `publish`
    "set every gpgWarnOnFailure := true"
  ]
}
