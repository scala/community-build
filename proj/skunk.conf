// https://github.com/typelevel/skunk.git#d4a6022ecf78c1d363c495827f46e4afcc2bf8af  # was main

// frozen (hopefully temporarily) because a newer commit depends on a
// snapshot from a resolver we don't have

vars.proj.skunk: ${vars.base} {
  name: "skunk"
  uri: "https://github.com/typelevel/skunk.git#d4a6022ecf78c1d363c495827f46e4afcc2bf8af"

  extra.exclude: [
    "docs", "bench"  // out of scope
    "example"  // would require adding more dependencies. maybe someday
    "*JS", "*Native"
  ]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
    // I think the tests need a database, I get tons of java.net.ConnectExceptions
    "set tests.jvm / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"
  ]
}
