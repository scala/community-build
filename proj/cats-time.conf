// https://github.com/typelevel/cats-time.git#main

vars.proj.cats-time: ${vars.base} {
  name: "cats-time"
  uri: "https://github.com/typelevel/cats-time.git#e50b2a484a2b2710adbe4bc13e36905fcb7b932e"

  extra.exclude: ["*JS", "*Native", "docs"]
  extra.settings: ${vars.base.extra.settings} [
    // dbuild gets confused if only crossScalaVersions is set?!
    """ThisBuild / scalaVersion := "2.13.10""""
  ]
  extra.commands: ${vars.default-commands} [
    "set every gpgWarnOnFailure := true"
    // don't ask for GPG passphrase when running locally
    """set every gpgOptions := Seq("--yes", "--passphrase", "", "--pinentry-mode", "loopback")"""
  ]
}
