// https://github.com/scalameta/mdoc.git#3f90e94ea27222a0df2cd55987031a30f38a5878  # was main

// frozen (April 2026) because newer commits appear to need newer scalameta; we should
// be able to unfreeze once scalameta advances

vars.proj.mdoc: ${vars.base} {
  name: "mdoc"
  uri: "https://github.com/scalameta/mdoc.git#3f90e94ea27222a0df2cd55987031a30f38a5878"

  extra.exclude: [
    "js*", "docs", "unit", "plugin", "*JS", "*Native"
    // tests-only, and it downloads Maven Central artifacts but doesn't use the right Scala binary version.
    // probably not worth tinkering with
    "worksheets"
  ]
}
