// https://github.com/scala/scala-swing.git#work

vars.proj.scala-swing: ${vars.base} {
  name: "scala-swing"
  uri: "https://github.com/scala/scala-swing.git#e38431adcffe0ef2757b90c0adfc78e7575e8c93"

  extra.commands: ${vars.default-commands} [
    // work around https://github.com/scala/community-builds/issues/575
    // (in a community build context, we don't need MiMa to run)
    "set every scalaModuleMimaPreviousVersion := None"
  ]
  extra.settings: ${vars.base.extra.settings} [
    // javax.swing.JApplet was removed in JDK 26
    """LocalProject("swing") / Compile / unmanagedSources / excludeFilter := { if (scala.util.Properties.isJavaAtLeast("26")) HiddenFileFilter || "Applet.scala" else HiddenFileFilter }"""
    """LocalProject("examples") / Compile / unmanagedSources / excludeFilter := { if (scala.util.Properties.isJavaAtLeast("26")) HiddenFileFilter || "SimpleApplet.scala" else HiddenFileFilter }"""
  ]
}
