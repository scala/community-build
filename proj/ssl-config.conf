// https://github.com/lightbend/ssl-config.git#main

vars.proj.ssl-config: ${vars.base} {
  name: "ssl-config"
  uri: "https://github.com/lightbend/ssl-config.git#a5a0f88eae18e196c8eaf0b345907bfeb8754097"

  extra.projects: ["sslConfigCore"]
  // repeated hangs during testing; see
  // https://github.com/scala/community-builds/issues/560
  // (last confirmed: January 2018)
  extra.test-tasks: ["compile"]
  extra.settings: ${vars.base.extra.settings} [
    // -release:8 hides the JDK-internal sun.security packages on JDK 17+
    """LocalProject("sslConfigCore") / scalacOptions ~= (opts => if (scala.util.Properties.isJavaAtLeast("17")) opts.filterNot(_ == "-release:8") else opts)"""
    // the sun.security.x509 API used by the fake key stores changed in JDK 21
    """LocalProject("sslConfigCore") / Compile / unmanagedSources / excludeFilter := { if (scala.util.Properties.isJavaAtLeast("21")) HiddenFileFilter || "FakeKeyStore.scala" || "FakeChainedKeyStore.scala" else HiddenFileFilter }"""
  ]
}
