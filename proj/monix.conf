// https://github.com/scalacommunitybuild/monix.git#community-build-2.13  # was monix, series/3.x

// forked (May 2022) to remove comment with bidirectional Unicode characters

// note that as of August 2025, monix has gone unmaintained for some years now.
// so we shouldn't hesitate to make necessary cuts or eject it entirely

vars.proj.monix: ${vars.base} {
  name: "monix"
  uri: "https://github.com/scalacommunitybuild/monix.git#fcc6e80b0f8105a4f4b6eaf933f92e11fb469f8e"

  extra.projects: [
    "coreJVM", "reactiveJVM"
    // monix-bio needs this
    "catnapJVM"
  ]
  extra.commands: ${vars.default-commands} [
    // intermittent failures, plus a new always-reproducible hang on JDK 25,
    // so let's just compile the tests but not run them
    "set executionJVM / Test / executeTests := Tests.Output(TestResult.Passed, Map(), Iterable())"
  ]
}
